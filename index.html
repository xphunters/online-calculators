        // --- Standard EMI Calculation Function (Helper for Rate Finder) ---
        function calculateEmiForRate(P, monthlyRate, N) {
            if (monthlyRate <= 0) { // Handle 0% rate separately
                return P / N;
            }
            const emiNumerator = P * monthlyRate * Math.pow(1 + monthlyRate, N);
            const emiDenominator = Math.pow(1 + monthlyRate, N) - 1;
            if (emiDenominator === 0) return Infinity; // Avoid division by zero
            return emiNumerator / emiDenominator;
        }
